<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Vision Test — ReflexLab</title>
  <meta name="description" content="Spot the odd color tile as the shades get closer. Test your color vision and compare with others. Free, no signup." />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/test.css" />
  <meta property="og:site_name" content="ReflexLab" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Color Vision Test — ReflexLab" />
  <meta property="og:description" content="Spot the odd color tile as the shades get closer. Test your color vision and compare with others. Free, no signup." />
  <meta property="og:url" content="https://reflexlab.tobiascent.workers.dev/tests/color-vision/color-vision.html" />
  <meta name="twitter:card" content="summary" />
</head>
<body>
  <main class="container">
    <div class="game-wrap">
      <div class="crumb"><a href="../../index.html">ReflexLab</a> &gt; Color Vision</div>

      <div class="result-card">
        <div class="title">Color Vision</div>
        <div class="big" id="bigScore">—</div>
        <div class="unit">levels</div>
        <div class="pct" id="pctText">Play to see your ranking</div>
        <div><span class="best-chip" id="bestChip">No record yet</span></div>
        <div class="card-actions">
          <button class="btn btn-primary" id="btnPlay">Play</button>
          <button class="btn btn-ghost" id="btnShare">Share</button>
        </div>
      </div>

      <div id="grid" class="mem-grid" style="grid-template-columns: repeat(2, 1fr); max-width: 400px; margin: 0 auto;"></div>
      <div id="roundInfo" class="score-label"></div>

      <div class="stats-card">
        <h2>Color Vision Statistics</h2>
        <div id="compareBox" class="compare-box"></div>
        <div class="hist-title">YOUR PROGRESS (last 5 sessions)</div>
        <svg id="progChart" viewBox="0 0 600 140" style="width:100%; height:auto; display:block;"></svg>
      </div>

      <p class="msg" id="msg"></p>
    </div>
  </main>
  <script src="../../js/utils.js"></script>
  <script src="color-vision.js"></script>
</body>
</html>
