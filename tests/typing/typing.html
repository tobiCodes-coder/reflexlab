<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Speed Test — ReflexLab</title>
  <meta name="description" content="Test your typing speed in WPM with live accuracy highlighting. Compare with average and professional typists. Free, no signup." />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/test.css" />
  <meta property="og:site_name" content="ReflexLab" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Typing Speed Test — ReflexLab" />
  <meta property="og:description" content="Test your typing speed in WPM with live accuracy highlighting. Compare with average and professional typists. Free, no signup." />
  <meta property="og:url" content="https://reflexlab.tobiascent.workers.dev/tests/typing/typing.html" />
  <meta name="twitter:card" content="summary" />
</head>
<body>
  <main class="container">
    <div class="game-wrap">
      <div class="crumb"><a href="../../index.html">ReflexLab</a> &gt; Typing Speed</div>

      <div class="result-card">
        <div class="title">Typing Speed</div>
        <div class="big" id="bigScore">—</div>
        <div class="unit">WPM</div>
        <div class="pct" id="pctText">Play to see your ranking</div>
        <div><span class="best-chip" id="bestChip">No record yet</span></div>
        <div class="card-actions">
          <button class="btn btn-primary" id="btnPlay">New text</button>
          <button class="btn btn-ghost" id="btnShare">Share</button>
        </div>
      </div>

      <div id="target" class="type-target"></div>
      <input id="typeInput" class="type-input" type="text" placeholder="Start typing to begin..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

      <div class="stats-card">
        <h2>Typing Speed Statistics</h2>
        <div id="compareBox" class="compare-box"></div>
        <div class="hist-title">YOUR PROGRESS (last 5 sessions)</div>
        <svg id="progChart" viewBox="0 0 600 140" style="width:100%; height:auto; display:block;"></svg>
      </div>

      <p class="msg" id="msg"></p>
    </div>
  </main>
  <script src="../../js/utils.js"></script>
  <script src="typing.js"></script>
</body>
</html>
