<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verbal Memory Test — ReflexLab</title>
  <meta name="description" content="New word or one you have seen before? Test your verbal memory with a growing streak. Free, no signup." />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/test.css" />
</head>
<body>
  <main class="container">
    <div class="game-wrap">
      <a class="back-link" href="../../index.html">← Back to all tests</a>

      <header class="test-head">
        <h1>Verbal Memory</h1>
        <p>A word appears. Is it NEW, or have you seen it before?</p>
      </header>

      <!-- Word ekhane dekhabe -->
      <div id="gameBox" class="game-box">Click to start</div>

      <!-- Answer buttons -->
      <div class="result-row">
        <button id="btnNew" class="btn btn-primary" disabled>New word</button>
        <button id="btnSeen" class="btn btn-ghost" disabled>Seen before</button>
      </div>

      <!-- Final score -->
      <div id="scoreWrap" style="display:none;">
        <div class="score-label">Words correct</div>
        <div id="scoreBig" class="score-big">0</div>
      </div>

      <div class="result-row">
        <button id="btnRetry" class="btn btn-primary">Try again</button>
        <button id="btnShare" class="btn btn-ghost">Share score</button>
        <span id="bestBadge" class="badge"></span>
      </div>

      <p id="msg" class="msg"></p>
    </div>
  </main>

  <script src="../../js/utils.js"></script>
  <script src="verbal-memory.js"></script>
</body>
</html>
