<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Memory Test — ReflexLab</title>
  <meta name="description" content="How many digits can you hold in your mind? The number grows by one digit each level. Free, no signup." />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/test.css" />
</head>
<body>
  <main class="container">
    <div class="game-wrap">
      <a class="back-link" href="../../index.html">← Back to all tests</a>

      <header class="test-head">
        <h1>Number Memory</h1>
        <p>Memorize the number, then type it from memory. +1 digit every level.</p>
      </header>

      <!-- Number dekhabe ekhane -->
      <div id="gameBox" class="game-box">Click to start</div>

      <!-- Input phase -->
      <div id="inputWrap" class="input-row" style="display:none;">
        <input id="numInput" class="type-input" type="text" inputmode="numeric"
          maxlength="30" placeholder="Type the number..." autocomplete="off" />
      </div>

      <!-- Final score -->
      <div id="scoreWrap" style="display:none;">
        <div class="score-label">Digits remembered</div>
        <div id="scoreBig" class="score-big">0</div>
      </div>

      <div class="result-row">
        <button id="btnRetry" class="btn btn-primary">Try again</button>
        <button id="btnShare" class="btn btn-ghost">Share score</button>
        <span id="bestBadge" class="badge"></span>
      </div>

      <p id="msg" class="msg"></p>
    </div>
  </main>

  <script src="../../js/utils.js"></script>
  <script src="number-memory.js"></script>
</body>
</html>
