<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Memory Test — ReflexLab</title>
  <meta name="description" content="How many digits can you remember? Test your number memory and compare with average humans. Free, no signup." />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/test.css" />
  <meta property="og:site_name" content="ReflexLab" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Number Memory Test — ReflexLab" />
  <meta property="og:description" content="How many digits can you remember? Test your number memory and compare with average humans. Free, no signup." />
  <meta property="og:url" content="https://reflexlab.tobiascent.workers.dev/tests/number-memory/number-memory.html" />
  <meta name="twitter:card" content="summary" />
</head>
<body>
  <main class="container">
    <div class="game-wrap">
      <div class="crumb"><a href="../../index.html">ReflexLab</a> &gt; Number Memory</div>

      <div class="result-card">
        <div class="title">Number Memory</div>
        <div class="big" id="bigScore">—</div>
        <div class="unit">digits</div>
        <div class="pct" id="pctText">Play to see your ranking</div>
        <div><span class="best-chip" id="bestChip">No record yet</span></div>
        <div class="card-actions">
          <button class="btn btn-primary" id="btnPlay">Play</button>
          <button class="btn btn-ghost" id="btnShare">Share</button>
        </div>
      </div>

      <div id="gameBox" class="game-box seq"></div>
      <div class="input-row">
        <input id="numInput" class="type-input" type="text" inputmode="numeric" placeholder="Type the number..." autocomplete="off" disabled />
      </div>
      <div id="roundInfo" class="score-label"></div>

      <div class="stats-card">
        <h2>Number Memory Statistics</h2>
        <div id="compareBox" class="compare-box"></div>
        <div class="hist-title">YOUR PROGRESS (last 5 sessions)</div>
        <svg id="progChart" viewBox="0 0 600 140" style="width:100%; height:auto; display:block;"></svg>
      </div>

      <p class="msg" id="msg"></p>
    </div>
  </main>
  <script src="../../js/utils.js"></script>
  <script src="number-memory.js"></script>
</body>
</html>
